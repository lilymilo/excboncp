name: IoT-Node DevOps CI/CD

on:
  push:
    branches:
      - feat/IoT-node
      - main
      - feat/iot-esp32
    paths:
      - 'iot-node/**'
      - 'mosquitto/**'
      - 'docker-compose.yml'
      - 'shared-schemas/**'
      - '.github/workflows/iot-ci-cd.yml'
  pull_request:
    branches:
      - feat/IoT-node
      - main
    paths:
      - 'iot-node/**'
      - 'mosquitto/**'
      - 'docker-compose.yml'
      - 'shared-schemas/**'
      - '.github/workflows/iot-ci-cd.yml'
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. Firmware & Configuration Structure Verification
  # ============================================================================
  verify-firmware:
    name: Verify ESP32 Firmware & Diagrams
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Firmware Files & Configs
        run: |
          echo "Checking ESP32 sketch and Wokwi simulation files..."
          test -f iot-node/sketch.ino || { echo "sketch.ino not found!"; exit 1; }
          test -f iot-node/diagram.json || { echo "diagram.json not found!"; exit 1; }
          test -f iot-node/libraries.txt || { echo "libraries.txt not found!"; exit 1; }
          test -f mosquitto/config/mosquitto.conf || { echo "mosquitto.conf not found!"; exit 1; }
          test -f shared-schemas/attestation_payload.json || { echo "attestation_payload.json not found!"; exit 1; }
          echo "All firmware and config files present."

      - name: Validate JSON Files
        run: |
          python3 -c "import json; json.load(open('iot-node/diagram.json'))"
          python3 -c "import json; json.load(open('shared-schemas/attestation_payload.json'))"
          echo "JSON syntax is valid."

  # ============================================================================
  # 2. IoT Gateway Tests & Schema Validation
  # ============================================================================
  test-and-lint:
    name: IoT Gateway Unit Tests & Schema Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: iot-node/package.json

      - name: Install Gateway Dependencies
        working-directory: ./iot-node
        run: npm install

      - name: Run Syntax & Lint Checks
        working-directory: ./iot-node
        run: npm run lint

      - name: Run Telemetry Unit Tests
        working-directory: ./iot-node
        run: npm test

  # ============================================================================
  # 3. Docker Compose & Smoke Test
  # ============================================================================
  docker-ci:
    name: Docker Build & Compose Integration Test
    needs: [verify-firmware, test-and-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker Stack
        run: docker compose build

      - name: Launch Stack in Detached Mode (Simulation Active)
        run: |
          SIMULATION_MODE=true docker compose up -d

      - name: Wait for Services to be Ready & Healthy
        run: |
          echo "Checking container status..."
          docker compose ps
          echo "Waiting for IoT Gateway health endpoint..."
          for i in {1..30}; do
            if curl -s http://localhost:5050/health | grep -q '"status":"UP"'; then
              echo "IoT Gateway is UP and Healthy!"
              break
            fi
            echo "Waiting for health check... ($i/30)"
            sleep 2
          done

      - name: Run Smoke Test on API & Telemetry Pipeline
        run: |
          echo "Querying Health Endpoint:"
          curl -s http://localhost:5050/health | jq .
          
          echo "Simulating telemetry event:"
          curl -s -X POST http://localhost:5050/api/telemetry/simulate | jq .

          echo "Sleeping 3s to allow MQTT processing..."
          sleep 3

          echo "Querying Telemetry Store:"
          curl -s http://localhost:5050/api/telemetry | jq .

      - name: Teardown Docker Stack
        if: always()
        run: docker compose down -v

