# ExcbonCP Docker Compose — Development Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# This override mounts source code for hot reload and enables debug settings.

services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    volumes:
      - ./server:/app/server:ro
      - excboncp-data:/app/data
    ports:
      - "${SERVER_PORT:-8000}:8000"
      - "5678:5678"  # debugpy remote debugging port
    environment:
      - LOG_LEVEL=debug
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    command: >
      python -m uvicorn server.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/server
      --log-level debug
