# ExcbonCP Docker Compose — Production Configuration
# Usage: docker compose up -d

services:
  # ─── Central Engineering Server ───────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: excboncp-server
    ports:
      - "${SERVER_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - excboncp-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - excboncp-network

  # ─── MQTT Broker (future) ────────────────────────────────────────────
