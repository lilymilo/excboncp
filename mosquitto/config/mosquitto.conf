# ====================================================================
# CbonCP dMRV Platform — Local Mosquitto MQTT Broker Configuration
# Target: Hardware ESP32 & Backend Service Integration
# ====================================================================

# Port 1883: Standard MQTT TCP Listener
listener 1883 0.0.0.0
allow_anonymous true

# Port 9001: MQTT over WebSocket (untuk testing & web-portal direct monitoring)
listener 9001 0.0.0.0
protocol websockets

# Persistence & Data Storage
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

