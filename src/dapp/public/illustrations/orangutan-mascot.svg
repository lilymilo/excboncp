<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="ogBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EEF5EC" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ogBellyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F29858" />
      <stop offset="100%" stop-color="#E07936" />
    </linearGradient>
    <linearGradient id="ogTorsoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DF6D2E" />
      <stop offset="100%" stop-color="#B84F1C" />
    </linearGradient>
    <linearGradient id="ogHeadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EC8644" />
      <stop offset="100%" stop-color="#C95B22" />
    </linearGradient>
    <linearGradient id="ogFaceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF0D4" />
      <stop offset="100%" stop-color="#F5D7AD" />
    </linearGradient>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="200" cy="200" r="185" fill="url(#ogBgGlow)" />

  <!-- Tropical Leaves Backdrop (integrated botanical element) -->
  <g class="botanical-foliage">
    <!-- Left Leaves -->
    <ellipse cx="68" cy="326" rx="66" ry="26" transform="rotate(-38 68 326)" fill="#2E6B3F" />
    <path d="M22 346 Q72 320 114 306" stroke="#468859" stroke-width="2.5" stroke-linecap="round" />
    <ellipse cx="50" cy="256" rx="56" ry="22" transform="rotate(-62 50 256)" fill="#8FCB97" />
    <ellipse cx="90" cy="368" rx="48" ry="18" transform="rotate(-12 90 368)" fill="#BFE3C0" />

    <!-- Right Leaves -->
    <ellipse cx="332" cy="326" rx="66" ry="26" transform="rotate(38 332 326)" fill="#2E6B3F" />
    <path d="M378 346 Q328 320 286 306" stroke="#468859" stroke-width="2.5" stroke-linecap="round" />
    <ellipse cx="350" cy="256" rx="56" ry="22" transform="rotate(62 350 256)" fill="#8FCB97" />
    <ellipse cx="310" cy="368" rx="48" ry="18" transform="rotate(12 310 368)" fill="#BFE3C0" />
  </g>

  <!-- Body / Torso -->
  <g id="body">
    <!-- Left Arm -->
    <ellipse cx="112" cy="342" rx="26" ry="60" transform="rotate(8 112 342)" fill="#B84F1C" />
    
    <!-- Torso -->
    <ellipse cx="200" cy="362" rx="118" ry="94" fill="url(#ogTorsoGrad)" />
    <!-- Shoulders -->
    <ellipse cx="200" cy="298" rx="100" ry="46" fill="#C95B22" />
    <!-- Belly -->
    <ellipse cx="200" cy="370" rx="66" ry="54" fill="url(#ogBellyGrad)" />

    <!-- Right Arm / Paws (relaxed or ready to wave) -->
    <ellipse cx="288" cy="342" rx="26" ry="60" transform="rotate(-8 288 342)" fill="#C95B22" />
    <circle cx="292" cy="392" r="22" fill="#B84F1C" />
    <circle cx="108" cy="392" r="22" fill="#9E3E12" />
  </g>

  <!-- Head & Facial Features -->
  <g id="head">
    <!-- Ears -->
    <ellipse cx="94" cy="188" rx="24" ry="27" fill="#B84F1C" />
    <ellipse cx="96" cy="188" rx="13" ry="15" fill="#E8C396" />
    <ellipse cx="306" cy="188" rx="24" ry="27" fill="#B84F1C" />
    <ellipse cx="304" cy="188" rx="13" ry="15" fill="#E8C396" />

    <!-- Main Hair / Head Silhouette -->
    <ellipse cx="200" cy="172" rx="118" ry="104" fill="url(#ogHeadGrad)" />

    <!-- Hair Tuft on top -->
    <path d="M182 78 Q200 48 212 74 Q228 52 232 80 Z" fill="#FFA56A" />

    <!-- Cream Face Mask (Heart/Peanut Shape of friendly young orangutan) -->
    <ellipse cx="200" cy="196" rx="88" ry="76" fill="url(#ogFaceGrad)" />
    <ellipse cx="200" cy="158" rx="76" ry="46" fill="url(#ogFaceGrad)" />
    <!-- Muzzle -->
    <ellipse cx="200" cy="222" rx="50" ry="34" fill="#F0CFA0" />

    <!-- Soft Rosy Cheeks -->
    <ellipse cx="136" cy="214" rx="16" ry="9" fill="#F2A08A" opacity="0.65" />
    <ellipse cx="264" cy="214" rx="16" ry="9" fill="#F2A08A" opacity="0.65" />

    <!-- Expressive Eyes -->
    <!-- Left Eye -->
    <g id="eye-left">
      <ellipse cx="165" cy="182" rx="14" ry="17" fill="#24140D" />
      <circle cx="169" cy="176" r="5.5" fill="#FFFFFF" />
      <circle cx="161" cy="188" r="2.5" fill="#FFFFFF" opacity="0.8" />
    </g>
    <!-- Right Eye -->
    <g id="eye-right">
      <ellipse cx="235" cy="182" rx="14" ry="17" fill="#24140D" />
      <circle cx="239" cy="176" r="5.5" fill="#FFFFFF" />
      <circle cx="231" cy="188" r="2.5" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- Friendly Eyebrows -->
    <path d="M152 152 Q166 146 178 152" stroke="#24140D" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M222 152 Q234 146 248 152" stroke="#24140D" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Nose / Nostrils -->
    <ellipse cx="192" cy="207" rx="4.5" ry="3.5" fill="#9C5931" />
    <ellipse cx="208" cy="207" rx="4.5" ry="3.5" fill="#9C5931" />

    <!-- Friendly Smile -->
    <path d="M182 232 Q200 246 218 232" stroke="#6E311A" stroke-width="4.5" stroke-linecap="round" fill="none" />
  </g>
</svg>

